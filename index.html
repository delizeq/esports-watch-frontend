
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080e1c">
  <meta name="description" content="Esports Watch — матчі, команди та турніри з кіберспорту.">
  <title>Esports Watch — кіберспорт</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#">
      <span class="logo-icon">E</span>
      <span>Esports <b>Watch</b></span>
    </a>

    <nav>
      <a class="active" href="#matches">Матчі</a>
      <a href="#matches">Турніри</a>
      <a href="#matches">Команди</a>
      <a href="#matches">Ігри</a>
    </nav>

    <div class="auth-buttons" id="auth-buttons">
      <button type="button" id="login-btn">Увійти</button>
      <button type="button" id="register-btn">Реєстрація</button>
    </div>

    <div class="user-panel" id="user-panel" hidden>
      <span id="username-display"></span>
      <button type="button" id="logout-btn">Вийти</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <span class="eyebrow">ESPORTS • LIVE UPDATES</span>
        <h1>Слідкуй за світом <span>кіберспорту</span></h1>
        <p>Матчі, турніри та команди — усе в одному місці.</p>
      </div>
      <div class="hero-decoration" aria-hidden="true">GG</div>
    </section>

    <section class="matches-section" id="matches">
      <div class="section-heading">
        <div>
          <span class="eyebrow">РОЗКЛАД</span>
          <h2>Матчі</h2>
          <p>Знайди потрібний матч і переглянь його деталі.</p>
        </div>
        <span class="live-indicator">
          <span></span> Оновлення з API
        </span>
      </div>

      <div class="filters">
        <label for="date">Фільтр за датою</label>
        <div class="filter-controls">
          <input type="date" id="date">
          <button id="reset" type="button">Показати всі</button>
        </div>
      </div>

      <p id="error" class="message" role="status" aria-live="polite"></p>
      <div id="matches" class="matches-list"></div>
    </section>

    <section class="auth-section" id="auth-section" hidden>
      <div class="auth-container">
        <h2 id="auth-title">Увійти</h2>

        <form id="auth-form">
          <label for="auth-username">Логін</label>
          <input
            type="text"
            id="auth-username"
            required
            autocomplete="username"
          >

          <div id="email-field" hidden>
            <label for="auth-email">Email</label>
            <input
              type="email"
              id="auth-email"
              autocomplete="email"
            >
          </div>

          <label for="auth-password">Пароль</label>
          <input
            type="password"
            id="auth-password"
            required
            autocomplete="current-password"
          >

          <div id="confirm-field" hidden>
            <label for="auth-confirm">Підтвердження пароля</label>
            <input
              type="password"
              id="auth-confirm"
              autocomplete="new-password"
            >
          </div>

          <button type="submit" id="auth-submit">
            Увійти
          </button>

          <button type="button" id="auth-cancel">
            Скасувати
          </button>
        </form>

        <p
          id="auth-message"
          role="status"
          aria-live="polite"
        ></p>
      </div>
    </section>
  </main>

  <footer>
    <a class="logo footer-logo" href="#">
      Esports <b>Watch</b>
    </a>
    <p>Кіберспорт — ближче, ніж здається.</p>
  </footer>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
